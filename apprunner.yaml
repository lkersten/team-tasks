version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm install --frozen-lockfile
      - npm run build
run:
  runtime-version: 22.14.0
  command: npm start
  network:
    port: 3000
  env:
    - name: NODE_ENV
      value: production
    - name: NEXT_TELEMETRY_DISABLED
      value: "1"
  # secrets:
  #   - name: DATABASE_URL
  #     value-from: "arn:aws:secretsmanager:region:account:secret:db-url"
  #   - name: AUTH_SECRET
  #     value-from: "arn:aws:secretsmanager:region:account:secret:auth-secret"
